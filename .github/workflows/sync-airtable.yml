name: Sync Airtable cases

on:
  workflow_dispatch:
  repository_dispatch:
    types: [airtable_sync]

permissions:
  contents: write

concurrency:
  group: airtable-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull P2 cases and founder-linked media
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: appNw0RvbOkZByR62
          AIRTABLE_TABLE_ID: tbl4yhZTG24EDB6KE
          AIRTABLE_PUBLIC_LEVEL: P2
          SYNC_MEDIA: images
        run: node scripts/sync-airtable.mjs

      - name: Commit changed snapshot and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cases.json data/founder-media.json assets/cases
          if git diff --cached --quiet; then
            echo "No Airtable changes to publish."
            exit 0
          fi
          git commit -m "Sync Airtable cases and founder media"
          git push
